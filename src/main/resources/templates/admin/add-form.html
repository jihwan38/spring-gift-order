<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>새 상품 추가</title>
</head>
<body>

<h1>새 상품 추가</h1>

<form th:action="@{/admin/products/add}" method="post" th:object="${product}">
  <p>
    <label for="name">상품명:</label><br>
    <input type="text" id="name" th:field="*{name}" size="30">
  <div style="color: red;" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
  </p>

  <p>
    <label for="price">가격:</label><br>
    <input type="number" id="price" th:field="*{price}">
  <div style="color: red;" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
  </p>

  <p>
    <label for="imageUrl">이미지 URL:</label><br>
    <input type="text" id="imageUrl" th:field="*{imageUrl}" size="50">
  <div style="color: red;" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></div>
  </p>

  <p>
    <label>카카오 MD 협의</label><br>
    <input type="checkbox" id="isKakaoApproved" th:field="*{isKakaoApprovedByMd}">
    <label for="isKakaoApproved">상품명에 '카카오'를 포함하는 것을 MD와 협의 된 경우 체크하세요.</label>
  </p>

  <hr>

  <h3>상품 옵션</h3>
  <div id="options-container">
    <div class="option-item">
      <label>옵션 1:</label><br>
      <input type="text" th:field="*{optionRequestDtoList[0].name}" placeholder="옵션명 (예: 색상: 레드)" size="30">
      <input type="number" th:field="*{optionRequestDtoList[0].quantity}" placeholder="수량">
      <div style="color: red;" th:if="${#fields.hasErrors('optionRequestDtoList[0].name')}" th:errors="*{optionRequestDtoList[0].name}"></div>
      <div style="color: red;" th:if="${#fields.hasErrors('optionRequestDtoList[0].quantity')}" th:errors="*{optionRequestDtoList[0].quantity}"></div>
    </div>
  </div>
  <div style="color: red;" th:if="${#fields.hasErrors('optionRequestDtoList')}" th:errors="*{optionRequestDtoList}"></div>
  <button type="button" id="add-option-btn" style="margin-top: 10px;">옵션 추가</button>

  <hr>

  <button type="submit">저장</button>
  <a href="/admin/products">취소</a>
</form>

<script>
  document.getElementById('add-option-btn').addEventListener('click', function() {
    const optionsContainer = document.getElementById('options-container');

    const newIndex = optionsContainer.getElementsByClassName('option-item').length;

    const newOptionDiv = document.createElement('div');
    newOptionDiv.classList.add('option-item');
    newOptionDiv.style.marginTop = '10px';

    newOptionDiv.innerHTML = `
            <label>옵션 ${newIndex + 1}:</label><br>
            <input type="text" name="optionRequestDtoList[${newIndex}].name" placeholder="옵션명 (예: 사이즈: L)" size="30">
            <input type="number" name="optionRequestDtoList[${newIndex}].quantity" placeholder="수량">
            <button type="button" class="remove-option-btn" style="margin-left: 5px;">삭제</button>
        `;

    optionsContainer.appendChild(newOptionDiv);
  });

  document.getElementById('options-container').addEventListener('click', function(e) {
    if (e.target && e.target.classList.contains('remove-option-btn')) {
      e.target.parentElement.remove();
    }
  });
</script>

</body>
</html>
