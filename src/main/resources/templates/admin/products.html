<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>상품 관리</title>
</head>
<body>

<h1>상품 목록</h1>

<table border="1">
  <thead>
  <tr>
    <th>ID</th>
    <th>상품명</th>
    <th>가격</th>
    <th>이미지</th>
    <th>옵션 목록 (3개까지만 보임)</th> <th>관리</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="product : ${products}">
    <td th:text="${product.id}"></td>
    <td th:text="${product.name}"></td>
    <td th:text="${product.formattedPrice}"></td> <td>
    <img th:src="${product.imageUrl}" alt="상품 이미지" width="100">
  </td>
    <td>
      <ul th:if="${not #lists.isEmpty(product.optionList)}">
        <li th:each="option, stat : ${product.optionList}" th:if="${stat.index < 3}">
          <span th:text="${option.name}"></span>
          (<span th:text="${option.quantity}"></span>개)
        </li>
      </ul>
    </td>
    <td>
      <a th:href="@{/admin/products/edit/{id}(id=${product.id})}">수정</a>
      <form th:action="@{/admin/products/delete/{id}(id=${product.id})}" method="post" style="display:inline;">
        <input type="hidden" name="_method" value="delete"> <button type="submit">삭제</button>
      </form>
    </td>
  </tr>

  <tr th:if="${#lists.isEmpty(products)}">
    <td colspan="6">등록된 상품이 없습니다.</td> </tr>
  </tbody>
</table>

<br> <a href="/admin/products/add">새 상품 추가</a>

</body>
</html>
